# Layered MLflow configuration for Milestone 2 tracking and model registry
# Usage: docker compose -f docker-compose.yml -f docker-compose.mlflow.yml up -d mlflow

services:
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: cybersentry-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - sentrynet

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: cybersentry-mlflow
    restart: unless-stopped
    depends_on:
      - postgres
      - minio
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: >
      bash -c "pip install --quiet psycopg2-binary boto3 &&
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${DB_USER:-sentry}:${DB_PASS:-sentry_dev_2026}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow-artifacts --serve-artifacts"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as u; u.urlopen('http://localhost:5000/health')
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - sentrynet

volumes:
  minio_data:
