# Kafka Topic Provisioning Specification
topics:
  - name: sec.raw
    partitions: 3
    replication_factor: 1
    retention_ms: 604800000   # 7 days
    cleanup_policy: delete

  - name: sec.normalized
    partitions: 3
    replication_factor: 1
    retention_ms: 604800000   # 7 days
    cleanup_policy: delete

  - name: sec.detections
    partitions: 3
    replication_factor: 1
    retention_ms: 604800000   # 7 days
    cleanup_policy: delete

  - name: sec.dlq
    partitions: 1
    replication_factor: 1
    retention_ms: 1209600000  # 14 days
    cleanup_policy: delete
